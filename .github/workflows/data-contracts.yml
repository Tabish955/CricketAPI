name: Data contracts and team assets
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate and sanitize live team flags and crests
        run: node scripts/verify-deployment.mjs | tee asset-validation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-http-evidence
          path: |
            asset-verification.json
            asset-samples.json
            asset-validation.log
            asset-null-teams.json
            flag-coverage.json
